
services:

  web:
    build:
      context: .
      target: production
    image: nawaat_nextjs:${APP_VERSION:-latest}
    container_name: nawaat_nextjs
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "3000:3000"
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/public/uploads:rw
      - next_cache:/app/.next/cache
    env_file:
      - .env.production
    networks:
      - nawaat_net
    

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node server.js"

  postgres:
    image: postgres:15
    container_name: nawaat_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nawaat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nawaat_rabbitmq
    hostname: nawaat-rabbit
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nawaat_net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: nawaat_postgres_data
  rabbitmq_data:
    name: nawaat_rabbitmq_data
  next_cache:
    name: nawaat_next_cache

networks:
  nawaat_net:
    name: nawaat_network