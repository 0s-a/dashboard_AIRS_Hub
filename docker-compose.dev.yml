  #     - nawaat_net

  #   healthcheck:
  #     test: rabbitmq-diagnostics -q ping
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_data:
    name: nawaat_postgres_data_dev


networks:
  nawaat_net:
    name: nawaat_network_dev
